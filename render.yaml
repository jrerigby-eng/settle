services:
  - type: web
    name: settle
    runtime: node
    plan: free
    buildCommand: "echo no build needed"
    startCommand: node server.js
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DEFAULT_CURRENCY
        value: USD
